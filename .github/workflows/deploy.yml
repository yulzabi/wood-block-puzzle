name: Deploy to GitHub Pages

# Builds the PWA and publishes dist/ to GitHub Pages on every push to main.
#
# This is configured for a PROJECT-site repo served at
# https://<user>.github.io/<repo>/ — the build sets VITE_BASE=/<repo>/ so all
# asset URLs, the service-worker scope, and the manifest start_url match.
#
# If you deploy to a USER-site repo named "<user>.github.io" (served at the
# domain root) or use a custom domain, change VITE_BASE below to "/".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate the deploy on types + tests — a broken commit must not ship
      # (Vite build alone does not type-check).
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Project site subpath. For a user site / custom domain, set to "/".
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
